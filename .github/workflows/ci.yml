name: ci

# Déclenché seulement par un push sur main (décision du projet) : aucune exécution avant le merge.
on:
  push:
    branches: [main]

# Jeton en lecture seule par défaut, élargi seulement dans le job qui atteste les JARs.
permissions:
  contents: read

# Une exécution à la fois ; une exécution en attente est remplacée par la plus récente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "27"
  NODE_VERSION: "26"
  MAVEN_ARGS: "-B -ntp"

jobs:
  tests-java:
    name: tests-java
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Testcontainers utilise le Docker préinstallé du runner.
      - run: mvn -f java/pom.xml -pl core,sources,web,worker -am test

  analyse-statique:
    name: analyse-statique
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PMD_JAVA_DISABLE_AUX_CLASSPATH_WARNINGS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: >-
          mvn -f java/pom.xml -pl core,sources,web,worker -am
          compile checkstyle:check pmd:check pmd:cpd-check spotless:check -DskipTests
      # Scripts d'exploitation déployés en production : leurs tests tournent avant tout déploiement.
      - run: bash scripts/tester-update.sh
      - run: bash scripts/tester-sauvegardes.sh
      - run: bash scripts/tester-exploitation.sh

  front:
    name: front
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: sh scripts/verifier-outillage.sh
      - run: sh scripts/tester-avertissements-front.sh
      - run: cd front && sh ../scripts/avertissements-front.sh npm-ci npm ci
      - run: cd front && npm run test:unit
      - run: cd front && npm run lint && npm run lint:css
      - run: cd front && sh ../scripts/avertissements-front.sh build npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front
          path: java/web/src/main/resources/static
          retention-days: 1
          if-no-files-found: error

  dependances:
    name: dependances
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Inventaire Maven puis analyse OSV (image épinglée dans le script, comme en local), bloquante.
      - run: bash scripts/analyse-dependances.sh local

  construction:
    name: construction
    needs: [tests-java, analyse-statique, front, dependances]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front
          path: java/web/src/main/resources/static
      - run: mvn -f java/pom.xml -pl web,worker -am package -DskipTests
      - name: Rassembler les JARs
        run: |
          mkdir dist
          cp java/web/target/web-*.jar dist/web.jar
          cp java/worker/target/worker-*.jar dist/worker.jar
      # L'attestation de provenance n'existe pas en dépôt privé avec le plan gratuit : seulement en public.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ github.event.repository.private == false }}
        with:
          subject-path: dist/*.jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars
          path: dist/*.jar
          retention-days: 1
          if-no-files-found: error
