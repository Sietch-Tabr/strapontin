name: ci

# Cache Maven (un jeu par job) dans les seuls jobs qui ne livrent rien (tests, analyse statique, dépendances) : construction
# et publication téléchargent tout depuis Maven Central, un cache empoisonné ne peut donc pas être livré.
# Seuls les push de main et de tags écrivent dans le cache (aucune PR, aucun fork).
# Déclenché par un push sur main (aucune exécution avant le merge) ou sur un tag de version : tous les jobs
# rejouent alors sur le commit étiqueté, puis le job publication crée la release.
on:
  push:
    branches: [main]
    tags: ['v*']

# Jeton en lecture seule par défaut, élargi seulement pour l'attestation (construction) et la release (publication).
permissions:
  contents: read

# Une exécution à la fois ; une exécution en attente est remplacée par la plus récente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "27"
  NODE_VERSION: "26"
  # Reprise des téléchargements après une limite de débit de Maven Central (HTTP 429, 3 essais
  # par défaut) : 6 essais, délai croissant plafonné à 60 s ; -V consigne la version de Maven.
  MAVEN_ARGS: >-
    -B -ntp -V
    -Daether.transport.http.retryHandler.count=6
    -Daether.transport.http.retryHandler.intervalMax=60000

jobs:
  tests-java:
    name: tests-java
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Un jeu par job : leurs plugins diffèrent, et une clé commune ne laissait enregistrer que le premier.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ github.job }}-
      # Testcontainers utilise le Docker préinstallé du runner.
      - run: mvn -f java/pom.xml -pl core,sources,web,worker,exploitation-commun,mise-a-jour -am test

  analyse-statique:
    name: analyse-statique
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PMD_JAVA_DISABLE_AUX_CLASSPATH_WARNINGS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Un jeu par job : leurs plugins diffèrent, et une clé commune ne laissait enregistrer que le premier.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ github.job }}-
      - run: >-
          mvn -f java/pom.xml -pl core,sources,web,worker,exploitation-commun,mise-a-jour -am
          compile checkstyle:check pmd:check pmd:cpd-check spotless:check -DskipTests
      # Scripts d'exploitation déployés en production : leurs tests tournent avant tout déploiement.
      - run: bash scripts/tester-update.sh
      - run: bash scripts/tester-sauvegardes.sh
      - run: bash scripts/tester-exploitation.sh
      - run: bash scripts/tester-verrou.sh
      - run: bash scripts/tester-preparer-mise-a-jour.sh

  front:
    name: front
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: sh scripts/verifier-outillage.sh
      - run: sh scripts/tester-avertissements-front.sh
      - run: cd front && sh ../scripts/avertissements-front.sh npm-ci npm ci
      - run: cd front && npm run test:unit
      - run: cd front && npm run lint && npm run lint:css
      - run: cd front && sh ../scripts/avertissements-front.sh build npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front
          path: java/web/src/main/resources/static
          retention-days: 1
          if-no-files-found: error

  dependances:
    name: dependances
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Un jeu par job : leurs plugins diffèrent, et une clé commune ne laissait enregistrer que le premier.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ github.job }}-
      # Inventaire Maven puis analyse OSV (image épinglée dans le script, comme en local), bloquante.
      - run: bash scripts/analyse-dependances.sh local

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Tout l'historique est analysé ; les faux positifs connus sont listés dans .gitleaksignore.
      # gitleaks v8.30.1, image désignée par son condensat.
      - run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --gitleaks-ignore-path /repo /repo

  construction:
    name: construction
    needs: [tests-java, analyse-statique, front, dependances, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front
          path: java/web/src/main/resources/static
      - run: mvn -f java/pom.xml -pl web,worker,mise-a-jour -am package -DskipTests
      - name: Rassembler les JARs
        run: |
          mkdir dist
          cp java/web/target/web-*.jar dist/web.jar
          cp java/worker/target/worker-*.jar dist/worker.jar
          cp java/mise-a-jour/target/mise-a-jour-*.jar dist/mise-a-jour.jar
          bash scripts/archive-exploitation.sh dist/exploitation.tar.gz
      # L'attestation de provenance n'existe pas en dépôt privé avec le plan gratuit : seulement en public.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ github.event.repository.private == false }}
        with:
          subject-path: |
            dist/*.jar
            dist/exploitation.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars
          path: |
            dist/*.jar
            dist/exploitation.tar.gz
          retention-days: 1
          if-no-files-found: error

  publication:
    name: publication
    needs: [construction]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ETIQUETTE: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: dist
      - name: Contrôler l'étiquette
        run: |
          # Une release ne vient que d'un commit de main, et son étiquette suit la version du pom
          # (vX.Y.Z, ou vX.Y.Z-suffixe pour une pré-version).
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          revision=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' java/pom.xml | head -1)
          case "$ETIQUETTE" in
            "v$revision" | "v$revision"-*) ;;
            *) echo "Étiquette $ETIQUETTE incompatible avec la version $revision du pom" >&2; exit 1 ;;
          esac
          echo "REVISION=$revision" >> "$GITHUB_ENV"
      - name: Écrire les notes
        run: node scripts/notes-release.mjs "$REVISION" > notes.md
      - name: Publier la release
        run: |
          (cd dist && sha256sum web.jar worker.jar mise-a-jour.jar exploitation.tar.gz > SHA256SUMS)
          drapeau=""
          case "$ETIQUETTE" in *-*) drapeau="--prerelease" ;; esac
          # Brouillon d'abord, publication une fois tous les fichiers joints.
          gh release create "$ETIQUETTE" --draft --verify-tag --title "$ETIQUETTE" \
            --notes-file notes.md $drapeau \
            dist/web.jar dist/worker.jar dist/mise-a-jour.jar dist/exploitation.tar.gz dist/SHA256SUMS
          gh release edit "$ETIQUETTE" --draft=false
