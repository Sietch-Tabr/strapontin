when:
  - event: push
    branch: main

steps:
  - name: test
    image: maven:3.9-eclipse-temurin-25
    volumes:
      - /var/cache/woodpecker/maven:/root/.m2
    commands:
      - mvn -f java/pom.xml -pl core,sources,web -am test
    when:
      - event: push
        branch: main

  - name: build
    image: maven:3.9-eclipse-temurin-25
    depends_on: [test]
    volumes:
      - /var/cache/woodpecker/maven:/root/.m2
    commands:
      - mvn -f java/pom.xml -pl web,worker -am package -DskipTests
    when:
      - event: push
        branch: main

  - name: deploy
    image: alpine
    depends_on: [build]
    environment:
      SSH_KEY:
        from_secret: ssh_key
      LXC_JAVA_HOST:
        from_secret: lxc_host
    commands:
      - apk add --no-cache openssh-client bash
      - bash scripts/woodpecker-deploy.sh
    when:
      - event: push
        branch: main
