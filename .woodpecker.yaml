when:
  - event: push
    branch: main

steps:
  - name: test
    image: maven:3.9-eclipse-temurin-25
    volumes:
      - /var/cache/woodpecker/maven:/root/.m2
    commands:
      - mvn -f java/pom.xml -pl core,sources,web -am test
    when:
      - event: push
        branch: main

  - name: build
    image: maven:3.9-eclipse-temurin-25
    depends_on: [test]
    volumes:
      - /var/cache/woodpecker/maven:/root/.m2
    commands:
      - mvn -f java/pom.xml -pl web,worker -am package -DskipTests
    when:
      - event: push
        branch: main

  - name: deploy
    image: alpine
    depends_on: [build]
    environment:
      SSH_KEY:
        from_secret: ssh_key
      LXC_JAVA_HOST:
        from_secret: lxc_host
    commands:
      - |
        set -euo pipefail
        apk add --no-cache openssh-client

        echo "$$SSH_KEY" > /tmp/key
        chmod 600 /tmp/key

        # Backup DB vers NAS avant chaque déploiement
        echo "[deploy] Backup DB avant déploiement..."
        ssh -i /tmp/key -o StrictHostKeyChecking=no root@$$LXC_JAVA_HOST \
          "/opt/strapontin/scripts/backup.sh"
        echo "[deploy] Backup OK"

        # Validation : exactement un JAR par module
        WEB_JAR=$(find java/web/target -name 'web-*.jar' ! -name '*.original')
        WEB_COUNT=$(echo "$WEB_JAR" | grep -c .)
        [ "$WEB_COUNT" -eq 1 ] || { echo "Ambiguïté JAR web : $WEB_COUNT trouvés" >&2; exit 1; }

        WORKER_JAR=$(find java/worker/target -name 'worker-*.jar' ! -name '*.original')
        WORKER_COUNT=$(echo "$WORKER_JAR" | grep -c .)
        [ "$WORKER_COUNT" -eq 1 ] || { echo "Ambiguïté JAR worker : $WORKER_COUNT trouvés" >&2; exit 1; }

        # Déploiement atomique : scp vers *.jar.new, update.sh fait le mv
        scp -i /tmp/key -o StrictHostKeyChecking=no "$WEB_JAR" root@$$LXC_JAVA_HOST:/opt/strapontin/web.jar.new
        scp -i /tmp/key -o StrictHostKeyChecking=no "$WORKER_JAR" root@$$LXC_JAVA_HOST:/opt/strapontin/worker.jar.new
        ssh -i /tmp/key -o StrictHostKeyChecking=no root@$$LXC_JAVA_HOST "/opt/strapontin/update.sh"
    when:
      - event: push
        branch: main
