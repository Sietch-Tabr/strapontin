steps:
  - name: test
    image: node:24
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile --store-dir ./.pnpm-store
      - pnpm -r test
    when:
      - event: push

  - name: typecheck
    image: node:24
    depends_on: [test]
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile --store-dir ./.pnpm-store
      - printf 'DATABASE_URL=x\nBETTER_AUTH_SECRET=x\nREDIS_URL=x\nPUBLIC_BASE_URL=http://localhost\n' > .env
      - pnpm --filter @strapontin/web run check
      - pnpm --filter @strapontin/worker exec tsc --noEmit
      - pnpm audit --audit-level=high
    when:
      - event: push

  - name: deploy
    image: alpine
    depends_on: [typecheck, test]
    environment:
      SSH_KEY:
        from_secret: ssh_key
      LXC_HOST:
        from_secret: lxc_host
    commands:
      - apk add openssh-client
      - echo "$$SSH_KEY" > /tmp/key && chmod 600 /tmp/key
      - ssh -i /tmp/key -o StrictHostKeyChecking=no root@$$LXC_HOST "/opt/strapontin/scripts/update.sh"
    when:
      - event: push
        branch: main
