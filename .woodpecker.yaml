steps:
  - name: test
    image: maven:3.9-eclipse-temurin-25
    volumes:
      - /var/cache/woodpecker/maven:/root/.m2
    commands:
      - mvn -f java/pom.xml -pl core,sources test
    when:
      - event: push

  - name: build
    image: maven:3.9-eclipse-temurin-25
    depends_on: [test]
    volumes:
      - /var/cache/woodpecker/maven:/root/.m2
    commands:
      - mvn -f java/pom.xml -pl web,worker -am package -DskipTests
    when:
      - event: push

  - name: deploy
    image: alpine
    depends_on: [build]
    environment:
      SSH_KEY:
        from_secret: ssh_key
      LXC_JAVA_HOST:
        from_secret: lxc_java_host
    commands:
      - apk add openssh-client
      - echo "$$SSH_KEY" > /tmp/key && chmod 600 /tmp/key
      - scp -i /tmp/key -o StrictHostKeyChecking=no java/web/target/web-2.0.0-SNAPSHOT.jar root@$$LXC_JAVA_HOST:/opt/strapontin-java/web.jar
      - scp -i /tmp/key -o StrictHostKeyChecking=no java/worker/target/worker-2.0.0-SNAPSHOT.jar root@$$LXC_JAVA_HOST:/opt/strapontin-java/worker.jar
      - ssh -i /tmp/key -o StrictHostKeyChecking=no root@$$LXC_JAVA_HOST "/opt/strapontin-java/update.sh"
    when:
      - event: push
        branch: v2
