# Strapontin — périmètre restreint (pas de scan complet de l'OS) : JARs, fichier d'environnement,
# scripts d'exploitation, unités systemd de l'application (sauvegardes et intégrité comprises) et
# leurs drop-ins, vecteurs de persistance classiques. Chaque règle couvre aussi les fichiers dont
# le chemin commence par le sien (web.jar.new, strapontin-web.service.d/…).
# database (sans suffixe) supprimé en AIDE v0.19 — database_in/database_out obligatoires.
database_in=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
gzip_dbout=no

Checksums = p+i+n+u+g+s+m+c+sha256

/opt/strapontin/application Checksums
/opt/strapontin/exploitation Checksums
/etc/opt/strapontin Checksums
/etc/systemd/system/strapontin- Checksums
