<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strapontin — Maintenance en cours</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --border: #262626;
        --text: #e5e5e5;
        --muted: #737373;
        --accent: #a3a3a3;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --surface: #ffffff;
          --border: #e5e5e5;
          --text: #171717;
          --muted: #737373;
          --accent: #525252;
        }
      }

      html,
      body {
        height: 100%;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family:
          "Geist",
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .carte {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 2.5rem 3rem;
        max-width: 28rem;
        width: 100%;
        text-align: center;
      }

      .icone {
        font-size: 2.5rem;
        margin-bottom: 1.25rem;
        opacity: 0.7;
      }

      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 0.75rem;
      }

      p {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .separateur {
        border: none;
        border-top: 1px solid var(--border);
        margin: 1.75rem 0;
      }

      .indication {
        color: var(--accent);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="carte">
      <div class="icone" aria-hidden="true">&#9881;</div>
      <h1>Maintenance en cours</h1>
      <p>
        Strapontin est temporairement indisponible. Une mise à jour est en
        cours&nbsp;&mdash; l'application sera de nouveau accessible dans
        quelques minutes.
      </p>
      <hr class="separateur" />
      <p class="indication">Cette page se rechargera automatiquement.</p>
    </div>
    <script>
      (function () {
        function verifier() {
          fetch("/", { method: "HEAD", cache: "no-store" })
            .then(function (r) {
              if (r.ok) window.location.reload();
            })
            .catch(function () {});
        }
        setInterval(verifier, 5000);
      })();
    </script>
  </body>
</html>
