when:
  - event: cron
    cron: restore-test-hebdo

steps:
  - name: restore-test
    image: alpine
    environment:
      SSH_KEY:
        from_secret: ssh_key
      PROXMOX_HOST:
        from_secret: proxmox_host
    commands:
      - apk add --no-cache openssh-client bash curl
      - bash scripts/woodpecker-restore-test.sh
