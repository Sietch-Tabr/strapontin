when:
  - event: cron
    cron: restore-test-hebdo

steps:
  - name: restore-test
    image: alpine
    environment:
      SSH_KEY:
        from_secret: ssh_key
      PROXMOX_HOST:
        from_secret: proxmox_host
    commands:
      - apk add --no-cache openssh-client bash curl
      - bash scripts/woodpecker-restore-test.sh

  - name: alerte-echec
    image: alpine
    depends_on: [restore-test]
    environment:
      RESEND_API_KEY:
        from_secret: resend_api_key
      ALERTE_EXPEDITEUR:
        from_secret: alerte_expediteur
      ALERTE_DESTINATAIRE:
        from_secret: alerte_destinataire
    commands:
      - apk add --no-cache curl jq
      - bash scripts/woodpecker-restore-test-alerte.sh
    when:
      - status: [failure]
