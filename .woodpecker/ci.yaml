concurrency:
  limit: 1

when:
  - event: push
    branch: main

steps:
  - name: test
    image: maven:3.9-eclipse-temurin-26
    volumes:
      - /var/cache/woodpecker/maven:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - mvn -f java/pom.xml -pl core,sources,web,worker -am test
    when:
      - event: push
        branch: main

  - name: test-front
    image: node:26-alpine
    volumes:
      - /var/cache/woodpecker/npm:/root/.npm
    commands:
      - cd front && npm ci && npm run test:unit
    when:
      - event: push
        branch: main

  # Checkstyle/PMD liés à la phase verify (java/pom.xml) — étape distincte du step
  # test pour ne pas surcharger l'agent CI (1,5 Go RAM) en parallèle des
  # Testcontainers ; compile seul, pas de relance de test complet. Dépend aussi de
  # lint-front (donc de toute la chaîne front) : exécuté en parallèle de build-front,
  # ce step Maven (checkstyle+pmd) fait dépasser 1,5 Go cumulés et déclenche l'OOM
  # killer (constaté en reproduction, v2.9.1) — un seul step lourd à la fois sur cet
  # agent.
  - name: static-analysis
    image: maven:3.9-eclipse-temurin-26
    depends_on: [test, lint-front]
    environment:
      MAVEN_OPTS: "-Xmx768m"
      # L'image fixe la JDK 26 du projet : le rappel PMD sur la JDK utilisée pour
      # résoudre les classes standard n'a pas d'objet ici.
      PMD_JAVA_DISABLE_AUX_CLASSPATH_WARNINGS: "true"
    volumes:
      - /var/cache/woodpecker/maven:/root/.m2
    commands:
      # Ryuk (reaper Testcontainers) supprime les conteneurs du step test ~10s après la
      # déconnexion de la JVM, pas immédiatement à la fin du process Maven — laisse ce
      # nettoyage se terminer avant de solliciter à nouveau la mémoire de l'agent.
      - sleep 15
      - mvn -f java/pom.xml -pl core,sources,web,worker -am compile checkstyle:check pmd:check -DskipTests
    when:
      - event: push
        branch: main

  # Sérialisé après build-front (pas en parallèle) : les deux steps exécutent npm ci
  # dans le même workspace partagé de la pipeline (front/node_modules) — en parallèle,
  # deux npm ci concurrents sur le même répertoire produisent un ENOTEMPTY sur rmdir
  # (constaté en prod CI, v2.9.1).
  - name: lint-front
    image: node:26-alpine
    depends_on: [build-front]
    volumes:
      - /var/cache/woodpecker/npm:/root/.npm
    commands:
      - sh scripts/verifier-outillage.sh
      - cd front && npm ci && npm run lint && npm run lint:css
    when:
      - event: push
        branch: main

  - name: build-front
    image: node:26-alpine
    depends_on: [test-front]
    volumes:
      - /var/cache/woodpecker/npm:/root/.npm
    commands:
      - rm -rf java/web/src/main/resources/static/assets java/web/src/main/resources/static/index.html java/web/src/main/resources/static/sw.js
      - cd front && npm ci && npm run build
    when:
      - event: push
        branch: main

  - name: build
    image: maven:3.9-eclipse-temurin-26
    depends_on: [test, build-front, static-analysis, lint-front]
    volumes:
      - /var/cache/woodpecker/maven:/root/.m2
    commands:
      - mvn -f java/pom.xml -pl web,worker -am package -DskipTests
    when:
      - event: push
        branch: main

  - name: backup
    image: alpine
    depends_on: [build]
    environment:
      SSH_KEY:
        from_secret: ssh_key
      LXC_JAVA_HOST:
        from_secret: lxc_host
    commands:
      - apk add --no-cache openssh-client bash
      - bash scripts/woodpecker-backup.sh
    when:
      - event: push
        branch: main

  - name: deploy
    image: alpine
    depends_on: [backup]
    environment:
      SSH_KEY:
        from_secret: ssh_key
      LXC_JAVA_HOST:
        from_secret: lxc_host
    commands:
      - apk add --no-cache openssh-client bash
      - bash scripts/woodpecker-deploy.sh
    when:
      - event: push
        branch: main
