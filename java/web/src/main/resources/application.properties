server.port=8080

spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/strapontin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sessions persistantes (survivent aux redémarrages)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30d

spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=5m,maximumSize=200

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.servlet.session.cookie.same-site=strict

# Clé de déchiffrement app_config (= BETTER_AUTH_SECRET de l'ancienne DB)
app.config.secret=${APP_CONFIG_SECRET}

app.cookie.secure=true
