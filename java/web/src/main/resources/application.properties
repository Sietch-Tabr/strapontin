server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/strapontin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sessions persistantes (survivent aux redémarrages)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
# Timeout géré programmatiquement via SessionRepositoryCustomizer (spring.session.timeout ignoré par Spring Session 4)

spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=5m,maximumSize=200

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Cookie persistant 30 jours (aligne sur spring.session.timeout)
server.servlet.session.cookie.max-age=2592000

# Clé de déchiffrement app_config (= BETTER_AUTH_SECRET de l'ancienne DB)
app.config.secret=${APP_CONFIG_SECRET}

app.cookie.secure=true

# Lecture des en-têtes X-Forwarded-* envoyés par le reverse proxy (Nginx Proxy Manager)
server.forward-headers-strategy=native

# Coupe les connexions TCP établies sans requête (ex. processus tué sans FIN propre)
server.tomcat.connection-timeout=30000

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/opt/strapontin/logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

# Compression Gzip (HTML, CSS, JS, JSON)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Ressources statiques : cache immuable un an pour les assets Vite (noms hashés).
# Les CSS et sw.js sont exclus via WebMvcConfig (no-cache, must-revalidate).
spring.web.resources.cache.period=31536000

# Évite le conflit de déchargement logback lors du shutdown JVM
logging.register-shutdown-hook=false
