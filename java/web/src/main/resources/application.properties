server.port=8080

spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/strapontin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sessions persistantes (survivent aux redémarrages)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30d

spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=5m,maximumSize=200

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.servlet.session.cookie.same-site=strict
# Cookie persistant 30 jours (aligne sur spring.session.timeout)
server.servlet.session.cookie.max-age=2592000

# Clé de déchiffrement app_config (= BETTER_AUTH_SECRET de l'ancienne DB)
app.config.secret=${APP_CONFIG_SECRET}

app.cookie.secure=true

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/opt/strapontin/logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D
