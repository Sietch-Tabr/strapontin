<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <title>Hors ligne — Strapontin</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --fg-muted: #6b7280;
        --border: #e5e7eb;
        --accent: #f3f4f6;
        --accent-fg: #111827;
        --radius: 0.5rem;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.clair) {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --fg-muted: #a1a1aa;
          --border: #27272a;
          --accent: #27272a;
          --accent-fg: #fafafa;
        }
      }
      html.dark {
        --bg: #0a0a0a;
        --fg: #fafafa;
        --fg-muted: #a1a1aa;
        --border: #27272a;
        --accent: #27272a;
        --accent-fg: #fafafa;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
      }
      .conteneur {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 1rem;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        color: var(--fg-muted);
        max-width: 24rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 1rem;
        border-radius: var(--radius);
        font-size: 0.875rem;
        font-weight: 500;
        border: 1px solid var(--border);
        background: var(--accent);
        color: var(--accent-fg);
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn:hover { opacity: 0.85; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
    <script>
      (function () {
        var theme = "auto";
        try { theme = localStorage.getItem("strapontin-theme") || "auto"; } catch (_) {}
        var cookie = document.cookie.match(/(?:^|; )theme=([^;]*)/);
        if (cookie) theme = decodeURIComponent(cookie[1]);
        if (theme === "sombre") {
          document.documentElement.classList.add("dark");
        } else if (theme === "clair") {
          document.documentElement.classList.add("clair");
        }
      })();
    </script>
  </head>
  <body>
    <div class="conteneur">
      <svg
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        style="color: var(--fg-muted)"
        aria-hidden="true"
      >
        <line x1="1" y1="1" x2="23" y2="23" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Reconnectez-vous à Internet pour accéder à vos concerts et à votre
        liste de suivi.
      </p>
      <p id="msg-reconnexion" style="display: none"></p>
      <button id="btn-reessayer" class="btn">Réessayer</button>
    </div>
    <script>
      function afficherMsg(texte) {
        var el = document.getElementById("msg-reconnexion");
        if (!el) return;
        el.textContent = texte;
        el.style.display = "";
      }

      function reessayer() {
        var btn = document.getElementById("btn-reessayer");
        if (btn) btn.disabled = true;
        afficherMsg("Vérification de la connexion…");
        fetch("/manifest.json", { method: "HEAD", cache: "no-store" })
          .then(function () {
            afficherMsg("Connexion rétablie, rechargement…");
            window.location.href = "/?t=" + Date.now();
          })
          .catch(function () {
            afficherMsg("Toujours hors ligne — réessayez dans un instant.");
            if (btn) btn.disabled = false;
          });
      }

      document.getElementById("btn-reessayer").addEventListener("click", reessayer);

      window.addEventListener("online", function () {
        setTimeout(reessayer, 400);
      });
    </script>
  </body>
</html>
