<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
    <title>Hors ligne — Strapontin</title>
    <style>
      /* Fallback thème sombre par media query (document.cookie indisponible sur iOS PWA) */
      @media (prefers-color-scheme: dark) {
        html:not(.clair) {
          --bg: #0a0a0a;
          --bg-card: #111111;
          --bg-muted: #1a1a1a;
          --fg: #fafafa;
          --fg-muted: #a1a1aa;
          --fg-subtle: #71717a;
          --border: #27272a;
          --primary: #fafafa;
          --primary-fg: #09090b;
          --accent: #27272a;
          --accent-fg: #fafafa;
        }
      }
    </style>
    <script>
      (function () {
        /* localStorage en priorité (cookie inaccessible sur iOS PWA standalone) */
        var theme = "auto";
        try { theme = localStorage.getItem("strapontin-theme") || "auto"; } catch (_) {}
        var cookie = document.cookie.match(/(?:^|; )theme=([^;]*)/);
        if (cookie) theme = decodeURIComponent(cookie[1]);
        if (theme === "sombre") {
          document.documentElement.classList.add("dark");
        } else if (theme === "clair") {
          document.documentElement.classList.add("clair");
        }
        /* "auto" : la media query prefers-color-scheme prend le relais */
      })();
    </script>
  </head>
  <body>
    <div class="app-layout">
      <main class="main-content">
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 1rem;
            text-align: center;
            padding: 2rem;
          "
        >
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="color: var(--fg-muted)"
            aria-hidden="true"
          >
            <line x1="1" y1="1" x2="23" y2="23" />
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
            <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <line x1="12" y1="20" x2="12.01" y2="20" />
          </svg>
          <h1 style="font-size: 1.25rem; font-weight: 600">
            Vous êtes hors ligne
          </h1>
          <p style="color: var(--fg-muted); max-width: 24rem">
            Reconnectez-vous à Internet pour accéder à vos concerts et à votre
            liste de suivi.
          </p>
          <p
            id="msg-reconnexion"
            style="color: var(--fg-muted); max-width: 24rem; display: none"
            role="status"
          ></p>
          <button
            id="btn-reessayer"
            onclick="reessayer()"
            class="btn btn-secondary"
          >
            Réessayer
          </button>
        </div>
      </main>
    </div>
    <script>
      function afficherMsg(texte) {
        var el = document.getElementById("msg-reconnexion");
        if (!el) return;
        el.textContent = texte;
        el.style.display = "";
      }

      function reessayer() {
        var btn = document.getElementById("btn-reessayer");
        if (btn) btn.disabled = true;
        afficherMsg("Vérification de la connexion…");
        fetch("/manifest.json", { method: "HEAD", cache: "no-store" })
          .then(function () {
            afficherMsg("Connexion rétablie, rechargement…");
            window.location.href = "/?t=" + Date.now();
          })
          .catch(function () {
            afficherMsg("Toujours hors ligne — réessayez dans un instant.");
            if (btn) btn.disabled = false;
          });
      }

      window.addEventListener("online", function () {
        setTimeout(reessayer, 400);
      });
    </script>
  </body>
</html>
