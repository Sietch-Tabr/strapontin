<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strapontin — bounce email</title>
  </head>
  <body
    style="
      font-family: system-ui, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 32px 16px;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        padding: 32px;
        border: 1px solid #e5e5e5;
      "
    >
      <h2
        style="font-size: 20px; font-weight: 600; color: #c00; margin: 0 0 8px"
      >
        Bounce email
      </h2>
      <p style="color: #555; font-size: 14px; margin: 0 0 16px">
        Un email envoyé par Strapontin a été rejeté définitivement par le serveur
        destinataire.
      </p>
      <p style="color: #555; font-size: 14px; margin: 0 0 24px">
        Adresse concernée :
        <strong th:text="${emailBouncee}">utilisateur@exemple.fr</strong>
      </p>
      <p style="color: #555; font-size: 14px; margin: 0 0 24px">
        Vérifiez l'adresse email de cet utilisateur depuis la page
        d'administration.
      </p>
      <p style="margin-top: 24px">
        <a
          th:href="|${baseUrl}/admin|"
          style="
            display: inline-block;
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
          "
        >
          Aller à l'administration →
        </a>
      </p>
    </div>
    <p
      style="text-align: center; color: #aaa; font-size: 12px; margin-top: 24px"
    >
      Strapontin —
      <a th:href="|${baseUrl}/parametres|" style="color: #aaa"
        >Gérer mes préférences</a
      >
    </p>
  </body>
</html>
