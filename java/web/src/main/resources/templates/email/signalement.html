<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'Signalement — ' + ${typeLabel}">Signalement</title>
  </head>
  <body
    style="
      font-family: system-ui, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 32px 16px;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        padding: 32px;
        border: 1px solid #e5e5e5;
      "
    >
      <h2
        style="font-size: 20px; font-weight: 600; color: #111; margin: 0 0 8px"
        th:text="'Signalement — ' + ${typeLabel}"
      >
        Signalement
      </h2>
      <table
        style="border-collapse: collapse; width: 100%; margin-bottom: 24px"
      >
        <tr>
          <td
            style="padding: 8px 0; color: #888; font-size: 14px; width: 130px"
          >
            Utilisateur
          </td>
          <td
            style="padding: 8px 0; font-size: 14px; color: #111"
            th:text="${expediteurNom}"
          >
            Nom
          </td>
        </tr>
        <tr>
          <td style="padding: 8px 0; color: #888; font-size: 14px">Email</td>
          <td
            style="padding: 8px 0; font-size: 14px; color: #111"
            th:text="${expediteurEmail}"
          >
            email@example.com
          </td>
        </tr>
      </table>
      <p
        style="
          color: #555;
          font-size: 14px;
          white-space: pre-wrap;
          border-left: 3px solid #e5e5e5;
          padding-left: 12px;
          margin: 0;
        "
        th:text="${message}"
      >
        Message
      </p>
    </div>
    <p
      style="text-align: center; color: #aaa; font-size: 12px; margin-top: 24px"
    >
      Strapontin —
      <a th:href="|${baseUrl}/parametres|" style="color: #aaa"
        >Gérer mes préférences</a
      >
    </p>
  </body>
</html>
