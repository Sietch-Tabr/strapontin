<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Réinitialisation de votre mot de passe</title>
  </head>
  <body
    style="
      font-family: system-ui, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 32px 16px;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        padding: 32px;
        border: 1px solid #e5e5e5;
      "
    >
      <h2
        style="font-size: 20px; font-weight: 600; color: #111; margin: 0 0 8px"
      >
        Réinitialisation du mot de passe
      </h2>
      <p style="color: #555; margin: 0 0 24px">
        Vous avez demandé la réinitialisation de votre mot de passe. Cliquez sur
        le bouton ci-dessous. Ce lien est valable 1 heure.
      </p>
      <a
        th:href="${lienReset}"
        style="
          display: inline-block;
          background: #111;
          color: #fff;
          text-decoration: none;
          padding: 10px 20px;
          border-radius: 6px;
          font-size: 14px;
          font-weight: 500;
        "
      >
        Réinitialiser mon mot de passe →
      </a>
      <p style="color: #aaa; font-size: 13px; margin-top: 24px">
        Si vous n'êtes pas à l'origine de cette demande, ignorez cet email.
      </p>
    </div>
    <p
      style="text-align: center; color: #aaa; font-size: 12px; margin-top: 24px"
    >
      Strapontin —
      <a th:href="|${baseUrl}/parametres|" style="color: #aaa"
        >Gérer mes préférences</a
      >
    </p>
  </body>
</html>
