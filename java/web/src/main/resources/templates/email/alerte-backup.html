<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strapontin — échec backup</title>
  </head>
  <body
    style="
      font-family: system-ui, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 32px 16px;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        padding: 32px;
        border: 1px solid #e5e5e5;
      "
    >
      <h2
        style="font-size: 20px; font-weight: 600; color: #c00; margin: 0 0 8px"
      >
        Échec du backup nocturne
      </h2>
      <p
        style="color: #555; font-size: 14px; margin: 0 0 8px"
        th:text="${horodatage != null and !#strings.isEmpty(horodatage)} ? 'Démarré le : ' + ${horodatage} : 'Horodatage indisponible.'"
      >
        Horodatage
      </p>
      <p
        th:if="${raison != null and !#strings.isEmpty(raison)}"
        style="
          color: #333;
          font-size: 13px;
          font-family: monospace;
          background: #f5f5f5;
          border-left: 3px solid #c00;
          padding: 8px 12px;
          margin: 0 0 16px;
          word-break: break-all;
        "
        th:text="${raison}"
      >
        raison
      </p>
      <p style="color: #555; font-size: 14px; margin: 0 0 24px">
        Le backup local nocturne (dump PostgreSQL + .env + logs) n'a pas pu être
        complété. Vérifiez l'espace disque et les logs systemd sur le serveur.
      </p>
      <p style="margin-top: 24px">
        <a
          th:href="|${baseUrl}/admin|"
          style="
            display: inline-block;
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
          "
        >
          Aller à l'administration →
        </a>
      </p>
    </div>
    <p
      style="text-align: center; color: #aaa; font-size: 12px; margin-top: 24px"
    >
      Strapontin —
      <a th:href="|${baseUrl}/parametres|" style="color: #aaa"
        >Gérer mes préférences</a
      >
    </p>
  </body>
</html>
