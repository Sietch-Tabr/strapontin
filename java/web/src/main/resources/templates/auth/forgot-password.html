<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/auth}"
>
  <head>
    <title>Mot de passe oublié</title>
  </head>
  <body>
    <div layout:fragment="contenu">
      <h1 class="auth-title">Mot de passe oublié</h1>
      <p class="auth-subtitle">
        Entrez votre adresse email pour recevoir un lien de réinitialisation.
      </p>

      <div th:if="${succes}" data-delai="10000" class="alerte alerte-succes">
        Si cette adresse correspond à un compte, un email vous a été envoyé.
      </div>

      <form th:unless="${succes}" method="post" th:action="@{/forgot-password}">
        <div class="form-group">
          <label for="email">Adresse email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            autofocus
            required
          />
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          Envoyer le lien
        </button>
      </form>

      <p class="mt-4 text-sm text-muted texte-centre">
        <a th:href="@{/login}">← Retour à la connexion</a>
      </p>
    </div>
  </body>
</html>
