<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/auth}"
>
  <head>
    <title>Nouveau mot de passe</title>
  </head>
  <body>
    <div layout:fragment="contenu">
      <h1 class="auth-title">Nouveau mot de passe</h1>
      <p class="auth-subtitle">
        Choisissez un mot de passe d'au moins 12 caractères.
      </p>

      <div
        th:if="${erreur}"
        popover="manual"
        class="alerte alerte-erreur"
        th:text="${erreur}"
      ></div>

      <form method="post" th:action="@{/reset-password}">
        <input type="hidden" name="token" th:value="${token}" />
        <div class="form-group">
          <label for="motDePasse">Nouveau mot de passe</label>
          <input
            id="motDePasse"
            name="motDePasse"
            type="password"
            autocomplete="new-password"
            minlength="12"
            autofocus
            required
          />
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          Enregistrer
        </button>
      </form>

      <p class="mt-4 text-sm text-muted" style="text-align: center">
        <a th:href="@{/forgot-password}">Renvoyer un lien</a>
      </p>
    </div>
  </body>
</html>
