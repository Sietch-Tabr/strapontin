<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:lang="fr"
  th:class="${theme == 'sombre' ? 'dark' : (theme == 'clair' ? '' : '')}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}" />
    <link rel="manifest" th:href="@{/manifest.json}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <title layout:title-pattern="$CONTENT_TITLE — Strapontin">Strapontin</title>
  </head>
  <body th:class="${theme == 'sombre' ? 'dark' : ''}">
    <div class="app-layout">
      <!-- Sidebar desktop -->
      <nav class="sidebar">
        <div class="sidebar-logo">
          <a th:href="@{/}">Strapontin</a>
        </div>
        <div class="sidebar-nav">
          <a
            th:href="@{/}"
            th:classappend="${currentPage == 'accueil' ? ' actif' : ''}"
          >Accueil</a>
          <a
            th:href="@{/spectacles}"
            th:classappend="${currentPage == 'spectacles' ? ' actif' : ''}"
          >Mes spectacles</a>
          <a
            th:href="@{/decouverte}"
            th:classappend="${currentPage == 'decouverte' ? ' actif' : ''}"
          >Découverte</a>
          <a
            th:href="@{/artistes}"
            th:classappend="${currentPage == 'artistes' ? ' actif' : ''}"
          >Mes artistes</a>
          <a
            th:href="@{/salles}"
            th:classappend="${currentPage == 'salles' ? ' actif' : ''}"
          >Mes salles</a>
          <hr style="margin: 0.5rem 0; border-color: var(--border)" />
          <a
            sec:authorize="hasRole('ADMIN')"
            th:href="@{/admin}"
            th:classappend="${currentPage == 'admin' ? ' actif' : ''}"
          >Admin</a>
          <a
            th:href="@{/parametres}"
            th:classappend="${currentPage == 'parametres' ? ' actif' : ''}"
          >Paramètres</a>
          <a
            th:href="@{/aide}"
            th:classappend="${currentPage == 'aide' ? ' actif' : ''}"
          >Aide</a>
        </div>
        <div class="sidebar-footer">
          <span sec:authentication="name">Utilisateur</span>
          &nbsp;·&nbsp;
          <form th:action="@{/logout}" method="post" style="display: inline">
            <button
              type="submit"
              class="btn btn-sm"
              style="
                padding: 0;
                background: none;
                font-size: 0.8125rem;
                color: var(--fg-muted);
              "
            >
              Déconnexion
            </button>
          </form>
        </div>
      </nav>

      <!-- Contenu principal -->
      <main class="main-content">
        <div layout:fragment="contenu">
          <!-- contenu injecté par chaque template -->
        </div>
      </main>
    </div>

    <!-- Navigation mobile -->
    <nav class="bottom-nav">
      <div class="bottom-nav-items">
        <a
          th:href="@{/}"
          th:classappend="${currentPage == 'accueil' ? ' actif' : ''}"
        >
          <span>🎵</span><span>Accueil</span>
        </a>
        <a
          th:href="@{/spectacles}"
          th:classappend="${currentPage == 'spectacles' ? ' actif' : ''}"
        >
          <span>🎟️</span><span>Spectacles</span>
        </a>
        <a
          th:href="@{/decouverte}"
          th:classappend="${currentPage == 'decouverte' ? ' actif' : ''}"
        >
          <span>🔍</span><span>Découverte</span>
        </a>
        <a
          th:href="@{/parametres}"
          th:classappend="${currentPage == 'parametres' ? ' actif' : ''}"
        >
          <span>⚙️</span><span>Paramètres</span>
        </a>
      </div>
    </nav>

    <script th:src="@{/js/app.js}" defer></script>
  </body>
</html>
