<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:lang="fr"
  th:class="${theme == 'sombre' ? 'dark' : (theme == 'clair' ? '' : '')}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}" />
    <link rel="manifest" th:href="@{/manifest.json}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <title layout:title-pattern="$CONTENT_TITLE — Strapontin">Strapontin</title>
  </head>
  <body th:class="${theme == 'sombre' ? 'dark' : ''}">
    <div class="app-layout">
      <!-- Sidebar desktop -->
      <nav class="sidebar">
        <div class="sidebar-logo">
          <a th:href="@{/}">Strapontin</a>
        </div>
        <div class="sidebar-nav">
          <a
            th:href="@{/}"
            th:classappend="${currentPage == 'accueil' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-home"/></svg>
            Accueil
          </a>
          <a
            th:href="@{/spectacles}"
            th:classappend="${currentPage == 'spectacles' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-ticket"/></svg>
            Mes spectacles
          </a>
          <a
            th:href="@{/decouverte}"
            th:classappend="${currentPage == 'decouverte' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-compass"/></svg>
            Découverte
          </a>
          <hr style="margin: 0.5rem 0; border-color: var(--border)" />
          <a
            th:href="@{/artistes}"
            th:classappend="${currentPage == 'artistes' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-music"/></svg>
            Mes artistes
          </a>
          <a
            th:href="@{/salles}"
            th:classappend="${currentPage == 'salles' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-building-2"/></svg>
            Mes salles
          </a>
        </div>
        <div class="sidebar-footer">
          <a
            sec:authorize="hasRole('ADMIN')"
            th:href="@{/admin}"
            th:classappend="${currentPage == 'admin' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-shield-check"/></svg>
            Admin
          </a>
          <a
            th:href="@{/parametres}"
            th:classappend="${currentPage == 'parametres' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-settings"/></svg>
            Paramètres
          </a>
          <hr style="margin: 0.25rem 0; border-color: var(--border)" />
          <a
            th:href="@{/aide}"
            th:classappend="${currentPage == 'aide' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-help-circle"/></svg>
            Aide
          </a>
          <a
            th:href="@{/changelog}"
            th:classappend="${currentPage == 'changelog' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-history"/></svg>
            Nouveautés
          </a>
          <hr style="margin: 0.25rem 0; border-color: var(--border)" />
          <div class="sidebar-user">
            <span sec:authentication="principal.nom">Utilisateur</span>
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="btn-deconnexion">Déconnexion</button>
            </form>
          </div>
        </div>
      </nav>

      <!-- Contenu principal -->
      <main class="main-content">
        <div layout:fragment="contenu">
          <!-- contenu injecté par chaque template -->
        </div>
      </main>
    </div>

    <!-- Navigation mobile -->
    <nav class="bottom-nav">
      <div class="bottom-nav-items">
        <a
          th:href="@{/}"
          th:classappend="${currentPage == 'accueil' ? ' actif' : ''}"
        >
          <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-home"/></svg>
          <span>Accueil</span>
        </a>
        <a
          th:href="@{/spectacles}"
          th:classappend="${currentPage == 'spectacles' ? ' actif' : ''}"
        >
          <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-ticket"/></svg>
          <span>Spectacles</span>
        </a>
        <a
          th:href="@{/decouverte}"
          th:classappend="${currentPage == 'decouverte' ? ' actif' : ''}"
        >
          <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-compass"/></svg>
          <span>Découverte</span>
        </a>
        <a
          th:href="@{/parametres}"
          th:classappend="${currentPage == 'parametres' ? ' actif' : ''}"
        >
          <svg class="icon" aria-hidden="true"><use href="/icons/lucide-sprite.svg#icon-settings"/></svg>
          <span>Paramètres</span>
        </a>
      </div>
    </nav>

    <script th:src="@{/js/app.js}" defer></script>
  </body>
</html>
