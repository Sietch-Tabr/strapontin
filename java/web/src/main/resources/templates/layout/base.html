<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:lang="fr"
  th:class="${theme == 'sombre' ? 'dark' : (theme == 'clair' ? '' : '')}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="htmx-config" content='{"globalViewTransitions":true}' />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}" />
    <link rel="apple-touch-icon" th:href="@{/images/icon-192.png}" />
    <link rel="manifest" th:href="@{/manifest.json}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/pages.css}" />
    <title layout:title-pattern="$CONTENT_TITLE — Strapontin">Strapontin</title>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
  </head>
  <body
    th:class="${theme == 'sombre' ? 'dark' : ''}"
    hx-boost="true"
    hx-target="#contenu-principal"
    hx-select="#contenu-principal"
    hx-swap="outerHTML"
  >
    <div class="app-layout">
      <!-- Sidebar desktop — masquée pour les requêtes HTMX (fragment rendering) -->
      <nav class="sidebar" th:if="${!reqHtmx}">
        <div class="sidebar-logo">
          <a th:href="@{/}">Strapontin</a>
        </div>
        <div class="sidebar-nav">
          <a
            th:each="item : ${navPrincipal}"
            th:href="@{${item.href}}"
            th:classappend="${currentPage == item.page ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true">
              <use th:attr="href='/icons/lucide-sprite.svg#' + ${item.icone}" />
            </svg>
            <span th:text="${item.label}">…</span>
            <span
              class="nav-badge nav-badge--sidebar"
              th:if="${item.page == 'accueil' and nbNouveau != null and nbNouveau > 0}"
              th:text="${nbNouveau > 99 ? '99+' : nbNouveau}"
              th:attr="aria-label=${nbNouveau} + ' nouveaux concerts'"
            ></span>
          </a>
          <hr />
          <a
            th:each="item : ${navSecondaire}"
            th:href="@{${item.href}}"
            th:classappend="${currentPage == item.page ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true">
              <use th:attr="href='/icons/lucide-sprite.svg#' + ${item.icone}" />
            </svg>
            <span th:text="${item.label}">…</span>
          </a>
        </div>
        <div class="sidebar-footer">
          <a
            sec:authorize="hasRole('ADMIN')"
            th:href="@{/admin}"
            th:classappend="${currentPage == 'admin' ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true">
              <use href="/icons/lucide-sprite.svg#icon-shield-check" />
            </svg>
            Admin
          </a>
          <a
            th:each="item : ${navFooter}"
            th:href="@{${item.href}}"
            th:classappend="${currentPage == item.page ? ' actif' : ''}"
          >
            <svg class="icon" aria-hidden="true">
              <use th:attr="href='/icons/lucide-sprite.svg#' + ${item.icone}" />
            </svg>
            <span th:text="${item.label}">…</span>
          </a>
          <hr />
          <div class="sidebar-user">
            <span sec:authentication="principal.nom">Utilisateur</span>
            <form th:action="@{/logout}" method="post" hx-boost="false">
              <button type="submit" class="btn-deconnexion">Déconnexion</button>
            </form>
          </div>
        </div>
      </nav>

      <!-- Contenu principal -->
      <main id="contenu-principal" class="main-content">
        <div
          id="banniere-container"
          hx-get="/api/banniere"
          hx-trigger="every 1800s"
          hx-swap="innerHTML"
        >
          <th:block
            th:insert="~{layout/fragments/banniere :: banniere}"
          ></th:block>
        </div>
        <div layout:fragment="contenu">
          <!-- contenu injecté par chaque template -->
        </div>
      </main>
    </div>

    <!-- Navigation mobile — masquée pour les requêtes HTMX (fragment rendering) -->
    <nav
      id="bottom-nav"
      class="bottom-nav"
      th:if="${!reqHtmx}"
      aria-label="Navigation principale"
    >
      <div class="bottom-nav-items">
        <th:block th:each="item : ${navPrincipal}">
          <a
            th:href="@{${item.href}}"
            th:classappend="${currentPage == item.page ? ' actif' : ''}"
          >
            <span
              th:if="${item.page == 'accueil'}"
              class="bottom-nav-badge-wrapper"
            >
              <svg class="icon" aria-hidden="true">
                <use
                  th:attr="href='/icons/lucide-sprite.svg#' + ${item.icone}"
                />
              </svg>
              <span
                class="nav-badge"
                th:if="${nbNouveau != null and nbNouveau > 0}"
                th:text="${nbNouveau > 99 ? '99+' : nbNouveau}"
                th:attr="aria-label=${nbNouveau} + ' nouveaux concerts'"
              ></span>
            </span>
            <svg
              th:unless="${item.page == 'accueil'}"
              class="icon"
              aria-hidden="true"
            >
              <use th:attr="href='/icons/lucide-sprite.svg#' + ${item.icone}" />
            </svg>
            <span
              th:text="${item.label == 'Mes spectacles' ? 'Spectacles' : item.label}"
              >…</span
            >
          </a>
        </th:block>
        <button
          type="button"
          id="btn-nav-plus"
          class="bottom-nav-plus"
          th:classappend="${pagesDrawer.contains(currentPage) ? ' actif' : ''}"
          aria-expanded="false"
          aria-controls="tiroir-nav"
        >
          <svg class="icon" aria-hidden="true">
            <use href="/icons/lucide-sprite.svg#icon-menu" />
          </svg>
          <span>Plus</span>
        </button>
      </div>
    </nav>

    <!-- Drawer navigation mobile — masqué pour les requêtes HTMX (fragment rendering) -->
    <dialog
      id="dialog-nav-plus"
      th:if="${!reqHtmx}"
      aria-label="Menu supplémentaire"
    >
      <div class="dialog-nav-handle" aria-hidden="true"></div>
      <div class="dialog-nav-contenu">
        <a
          th:each="item : ${navSecondaire}"
          th:href="@{${item.href}}"
          th:classappend="${currentPage == item.page ? ' actif' : ''}"
        >
          <svg class="icon" aria-hidden="true">
            <use th:attr="href='/icons/lucide-sprite.svg#' + ${item.icone}" />
          </svg>
          <span th:text="${item.label}">…</span>
        </a>
        <hr class="dialog-nav-sep" />
        <a
          sec:authorize="hasRole('ADMIN')"
          th:href="@{/admin}"
          th:classappend="${currentPage == 'admin' ? ' actif' : ''}"
        >
          <svg class="icon" aria-hidden="true">
            <use href="/icons/lucide-sprite.svg#icon-shield-check" />
          </svg>
          Admin
        </a>
        <a
          th:each="item : ${navFooter}"
          th:href="@{${item.href}}"
          th:classappend="${currentPage == item.page ? ' actif' : ''}"
        >
          <svg class="icon" aria-hidden="true">
            <use th:attr="href='/icons/lucide-sprite.svg#' + ${item.icone}" />
          </svg>
          <span th:text="${item.label}">…</span>
        </a>
        <hr class="dialog-nav-sep" />
        <div class="dialog-nav-user">
          <span sec:authentication="principal.nom">Utilisateur</span>
          <form th:action="@{/logout}" method="post" hx-boost="false">
            <button type="submit" class="btn-deconnexion">Déconnexion</button>
          </form>
        </div>
      </div>
    </dialog>
  </body>
</html>
