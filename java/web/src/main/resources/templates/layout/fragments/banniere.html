<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="banniere">
      <div
        th:if="${banniereMessage != null}"
        id="banniere"
        class="banniere"
        th:classappend="${'banniere--' + banniereType}"
        th:attr="data-banniere-id=${banniereId}, data-banniere-type=${banniereType}"
        role="alert"
      >
        <span class="banniere-message" th:text="${banniereMessage}"></span>
        <button
          type="button"
          id="btn-fermer-banniere"
          class="banniere-fermer"
          aria-label="Fermer la bannière"
        >
          <svg class="icon" aria-hidden="true">
            <use href="/icons/lucide-sprite.svg#icon-x" />
          </svg>
        </button>
      </div>
    </th:block>
  </body>
</html>
