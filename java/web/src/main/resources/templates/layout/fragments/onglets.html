<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="onglets(items, ariaLabel)">
      <select
        class="param-onglets-mobile"
        th:attr="aria-label=${ariaLabel}"
      >
        <option
          th:each="item : ${items}"
          th:value="${item.ancre()}"
          th:text="${item.label()}"
        >Option</option>
      </select>
      <nav class="param-onglets" th:attr="aria-label=${ariaLabel}">
        <a
          th:each="item : ${items}"
          th:href="${item.ancre()}"
          class="param-onglet"
        >
          <svg width="16" height="16" aria-hidden="true">
            <use th:attr="href='/icons/lucide-sprite.svg#' + ${item.icone()}" />
          </svg>
          <span th:text="${item.label()}">…</span>
        </a>
      </nav>
    </th:block>
  </body>
</html>
