server.port=8081
server.address=127.0.0.1

spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/strapontin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway désactivé en prod — le module web applique les migrations au démarrage
spring.flyway.enabled=false

spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true
spring.quartz.overwrite-existing-jobs=true
spring.quartz.properties.org.quartz.threadPool.threadCount=4

app.config.secret=${APP_CONFIG_SECRET}
contact.email=${CONTACT_EMAIL:contact@example.com}
