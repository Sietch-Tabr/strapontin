server.port=8081
server.address=127.0.0.1
server.shutdown=graceful
# Aligné sur TimeoutStopSec=90s de strapontin-worker.service (#886) avec une marge de 10s pour
# une sortie propre avant le SIGKILL systemd.
spring.lifecycle.timeout-per-shutdown-phase=80s

spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/strapontin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway désactivé en prod — le module web applique les migrations au démarrage
spring.flyway.enabled=false

spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true
spring.quartz.overwrite-existing-jobs=true
spring.quartz.properties.org.quartz.threadPool.threadCount=10
# #886 : un déploiement (systemctl restart) pendant un cycle fetch en cours tuait le job
# silencieusement (RAMJobStore, aucune persistance). Nécessite un timeout HTTP borné sur
# TicketmasterSource/EventimSource (#887) pour ne pas risquer de faire pendre un déploiement.
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true

management.server.port=9091
management.endpoints.web.exposure.include=health,metrics,quartz,prometheus
management.endpoint.health.show-details=never

app.config.secret=${APP_CONFIG_SECRET}
