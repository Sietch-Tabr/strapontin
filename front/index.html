<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Strapontin</title>
  </head>
  <body>
    <div id="app"></div>
    <!--
      #766 : filet de secours hors bundle (premier lancement PWA hors-ligne avant toute
      synchronisation — le service worker n'a pas encore eu l'occasion de précacher les assets).
      Sans lui, un échec réseau sur /src/main.js laisse #app vide indéfiniment : écran noir sans
      aucun message. Script externe (public/offline-fallback.js), jamais inline : la Content
      Security Policy de l'application impose script-src 'self' sans unsafe-inline.
    -->
    <script src="/offline-fallback.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
